    <!-- MENU -->

    <div class="menu-container">

        <button class="menu-btn" id="menuBtn">

    <!-- SAC -->

    <section>

        <h2 class="section-title">
            Serviço de Atendimento ao Cliente
        </h2>

        <div class="sac">

            <p>
                Precisa de ajuda? Entre em contato com o nosso SAC.
                Preencha o formulário abaixo e envie sua mensagem.
            </p>


            <form id="formSAC">

                <input
                    type="text"
                    placeholder="Seu nome"
                    required
                >

                <input
                    type="email"
                    placeholder="Seu e-mail"
                    required
                >

                <textarea
                    placeholder="Digite sua mensagem"
                    required
                ></textarea>

                <button
                    type="submit"
                    class="btn">

                    Enviar mensagem

                </button>

            </form>

        </div>

    </section>


    <footer>

        © 2026 Biblioteca Livski — Todos os direitos reservados.

    </footer>
