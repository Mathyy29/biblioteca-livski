<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Carrinho - Biblioteca Livski</title>

<link
href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:#f5f1ea;

    color:#222;

    min-height:100vh;

}

/* CABEÇALHO */

header{

    background:#1b1b1b;

    color:white;

    padding:25px;

    text-align:center;

}

header h1{

    font-family:'Cinzel',serif;

    color:#c59b5f;

}

/* CONTEÚDO */

.container{

    width:90%;

    max-width:1000px;

    margin:50px auto;

}

/* LIVRO */

.item{

    background:white;

    border-radius:15px;

    padding:20px;

    margin-bottom:20px;

    display:flex;

    align-items:center;

    gap:20px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.1);

}

.item img{

    width:100px;

    height:140px;

    object-fit:cover;

    border-radius:10px;

}

.info{

    flex:1;

}

.info h3{

    font-family:'Cinzel',serif;

    margin-bottom:5px;

}

.info p{

    color:#666;

}

/* QUANTIDADE */

.quantidade{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:15px;

}

.quantidade button{

    width:35px;

    height:35px;

    border:none;

    border-radius:50%;

    background:#c59b5f;

    color:white;

    font-size:20px;

    cursor:pointer;

}

.quantidade button:hover{

    background:#a67c43;

}

.quantidade span{

    font-weight:bold;

}

/* PREÇO */

.preco-item{

    font-size:1.2rem;

    font-weight:bold;

    color:#2d7a32;

}

/* REMOVER */

.remover{

    border:none;

    background:#b52b2b;

    color:white;

    padding:10px 15px;

    border-radius:20px;

    cursor:pointer;

}

.remover:hover{

    background:#8e1f1f;

}

/* RESUMO */

.resumo{

    background:#2b2118;

    color:white;

    padding:30px;

    border-radius:20px;

    margin-top:30px;

    text-align:right;

}

.resumo h2{

    font-family:'Cinzel',serif;

    margin-bottom:20px;

}

.total{

    font-size:1.7rem;

    color:#d9b878;

    font-weight:bold;

    margin-bottom:20px;

}

/* BOTÕES */

.botoes{

    display:flex;

    justify-content:space-between;

    gap:20px;

    flex-wrap:wrap;

}

.btn{

    display:inline-block;

    padding:14px 25px;

    border:none;

    border-radius:30px;

    text-decoration:none;

    cursor:pointer;

    font-size:1rem;

    transition:0.3s;

}

.voltar{

    background:#777;

    color:white;

}

.voltar:hover{

    background:#555;

}

.finalizar{

    background:#c59b5f;

    color:white;

}

.finalizar:hover{

    background:#a67c43;

    transform:scale(1.05);

}

/* VAZIO */

.vazio{

    text-align:center;

    padding:80px 20px;

    background:white;

    border-radius:20px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.1);

}

.vazio h2{

    font-family:'Cinzel',serif;

    margin-bottom:15px;

}

.vazio p{

    color:#666;

    margin-bottom:25px;

}

/* RESPONSIVO */

@media(max-width:700px){

    .item{

        flex-direction:column;

        text-align:center;

    }

    .botoes{

        justify-content:center;

    }

    .resumo{

        text-align:center;

    }

}

</style>

</head>

<body>


<header>

    <h1>
        🛒 Carrinho Livski
    </h1>

</header>


<div class="container">

    <div id="listaCarrinho"></div>

    <div id="resumo"></div>

</div>


<script>

/* PEGAR CARRINHO */

let carrinho = JSON.parse(
    localStorage.getItem("carrinhoLivski")
) || [];


/* FORMATAR PREÇO */

function formatarPreco(valor){

    return valor.toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* MOSTRAR CARRINHO */

function mostrarCarrinho(){

    const lista =
        document.getElementById("listaCarrinho");

    const resumo =
        document.getElementById("resumo");


    lista.innerHTML = "";

    resumo.innerHTML = "";


    /* CARRINHO VAZIO */

    if(carrinho.length === 0){

        lista.innerHTML = `

            <div class="vazio">

                <h2>
                    Seu carrinho está vazio
                </h2>

                <p>
                    Você ainda não adicionou nenhum livro.
                </p>

                <button
                    class="btn voltar"
                    onclick="voltarBiblioteca()">

                    Voltar para a biblioteca

                </button>

            </div>

        `;

        return;

    }


    let total = 0;


    /* PRODUTOS */

    carrinho.forEach(function(livro,index){

        const subtotal =
            livro.preco * livro.quantidade;

        total += subtotal;


        lista.innerHTML += `

            <div class="item">

                <img
                    src="${livro.imagem}"
                    alt="${livro.nome}">

                <div class="info">

                    <h3>
                        ${livro.nome}
                    </h3>

                    <p>
                        ${livro.autor}
                    </p>

                    <div class="quantidade">

                        <button
                            onclick="diminuir(${index})">

                            −

                        </button>

                        <span>
                            ${livro.quantidade}
                        </span>

                        <button
                            onclick="aumentar(${index})">

                            +

                        </button>

                    </div>

                </div>

                <div>

                    <div class="preco-item">

                        ${formatarPreco(subtotal)}

                    </div>

                    <br>

                    <button
                        class="remover"
                        onclick="remover(${index})">

                        🗑 Remover

                    </button>

                </div>

            </div>

        `;

    });


    /* RESUMO */

    resumo.innerHTML = `

        <div class="resumo">

            <h2>
                Resumo da compra
            </h2>

            <div class="total">

                Total:
                ${formatarPreco(total)}

            </div>

            <div class="botoes">

                <button
                    class="btn voltar"
                    onclick="voltarBiblioteca()">

                    ← Voltar para a biblioteca

                </button>

                <button
                    class="btn finalizar"
                    onclick="finalizarCompra()">

                    Finalizar Compra →

                </button>

            </div>

        </div>

    `;

}


/* AUMENTAR */

function aumentar(index){

    carrinho[index].quantidade++;

    salvar();

}


/* DIMINUIR */

function diminuir(index){

    if(carrinho[index].quantidade > 1){

        carrinho[index].quantidade--;

    }else{

        carrinho.splice(index,1);

    }

    salvar();

}


/* REMOVER */

function remover(index){

    carrinho.splice(index,1);

    salvar();

}


/* SALVAR */

function salvar(){

    localStorage.setItem(
        "carrinhoLivski",
        JSON.stringify(carrinho)
    );

    mostrarCarrinho();

}


/* VOLTAR */

function voltarBiblioteca(){

    /*
       Como o carrinho foi aberto em uma nova guia,
       tentamos fechar esta guia.

       Caso o navegador não permita,
       voltamos para o index normalmente.
    */

    if(window.opener){

        window.close();

    }else{

        window.location.href = "index.html";

    }

}


/* FINALIZAR */

function finalizarCompra(){

    if(carrinho.length === 0){

        return;

    }

    window.location.href =
        "pagamento.html";

}


/* INICIAR */

mostrarCarrinho();

</script>

</body>

</html>
