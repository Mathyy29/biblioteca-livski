<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Carrinho - Biblioteca Livski</title>

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins', sans-serif;

    background:#f5f1ea;

    color:#222;

}


/* =========================
   CABEÇALHO
========================= */

header{

    background:#1b1b1b;

    color:white;

    padding:30px;

    text-align:center;

}

header h1{

    font-family:'Cinzel', serif;

    font-size:3rem;

}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:1000px;

    margin:50px auto;

    padding:20px;

}


/* =========================
   LIVRO DO CARRINHO
========================= */

.item{

    background:white;

    border-radius:15px;

    padding:20px;

    margin-bottom:20px;

    display:flex;

    align-items:center;

    gap:25px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.1);

}


.item img{

    width:100px;

    height:140px;

    object-fit:cover;

    border-radius:8px;

}


.info{

    flex:1;

}


.info h2{

    color:#3a2d1f;

    margin-bottom:5px;

}


.autor{

    color:#777;

    margin-bottom:10px;

}


.preco{

    color:#2d7a32;

    font-weight:bold;

    font-size:1.2rem;

}


/* =========================
   QUANTIDADE
========================= */

.quantidade{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:15px;

}


.quantidade button{

    width:35px;

    height:35px;

    border:none;

    border-radius:50%;

    background:#c59b5f;

    color:white;

    font-size:1.2rem;

    cursor:pointer;

}


.quantidade button:hover{

    background:#a67c43;

}


.numero{

    min-width:30px;

    text-align:center;

    font-weight:bold;

}


/* =========================
   REMOVER
========================= */

.remover{

    border:none;

    background:#b83232;

    color:white;

    padding:10px 15px;

    border-radius:20px;

    cursor:pointer;

}


.remover:hover{

    background:#8f2525;

}


/* =========================
   TOTAL
========================= */

.resumo{

    background:#2b2118;

    color:white;

    padding:30px;

    border-radius:20px;

    text-align:right;

    margin-top:30px;

}


.resumo h2{

    font-family:'Cinzel', serif;

    margin-bottom:10px;

}


.total{

    font-size:2rem;

    color:#d8b274;

    font-weight:bold;

}


/* =========================
   BOTÕES
========================= */

.botoes{

    display:flex;

    justify-content:space-between;

    gap:20px;

    margin-top:30px;

}


.btn{

    padding:14px 25px;

    border:none;

    border-radius:30px;

    background:#c59b5f;

    color:white;

    font-size:1rem;

    cursor:pointer;

    text-decoration:none;

    display:inline-block;

}


.btn:hover{

    background:#a67c43;

}


/* =========================
   CARRINHO VAZIO
========================= */

.vazio{

    text-align:center;

    background:white;

    padding:60px 20px;

    border-radius:20px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.1);

}


.vazio h2{

    font-family:'Cinzel', serif;

    margin-bottom:15px;

    color:#3a2d1f;

}


.vazio p{

    margin-bottom:25px;

}


/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    .item{

        flex-direction:column;

        text-align:center;

    }


    .botoes{

        flex-direction:column;

    }


    .resumo{

        text-align:center;

    }

}

</style>

</head>


<body>


<header>

    <h1>
        🛒 Seu Carrinho
    </h1>

    <p>
        Biblioteca Livski
    </p>

</header>


<div class="container">

    <div id="listaCarrinho"></div>


    <div
        id="resumo"
        style="display:none;">

        <div class="resumo">

            <h2>
                Resumo da compra
            </h2>

            <p>
                Total:
            </p>

            <div
                class="total"
                id="total">

                R$ 0,00

            </div>

        </div>


        <div class="botoes">

            <a
                href="index.html#catalogo"
                class="btn">

                ← Continuar comprando

            </a>


            <button
                class="btn"
                onclick="finalizarCompra()">

                Finalizar compra

            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   PEGAR CARRINHO
========================= */

function pegarCarrinho(){

    return JSON.parse(
        localStorage.getItem("carrinhoLivski")
    ) || [];

}


/* =========================
   SALVAR CARRINHO
========================= */

function salvarCarrinho(carrinho){

    localStorage.setItem(
        "carrinhoLivski",
        JSON.stringify(carrinho)
    );

}


/* =========================
   MOSTRAR CARRINHO
========================= */

function mostrarCarrinho(){

    const carrinho =
    pegarCarrinho();


    const lista =
    document.getElementById(
        "listaCarrinho"
    );


    const resumo =
    document.getElementById(
        "resumo"
    );


    lista.innerHTML = "";


    /* CARRINHO VAZIO */

    if(carrinho.length === 0){

        lista.innerHTML = `

            <div class="vazio">

                <h2>
                    Seu carrinho está vazio
                </h2>

                <p>
                    Você ainda não adicionou nenhum livro.
                </p>

                <a
                    href="index.html#catalogo"
                    class="btn">

                    Explorar livros

                </a>

            </div>

        `;


        resumo.style.display =
        "none";


        return;

    }


    resumo.style.display =
    "block";


    let total = 0;


    /* CRIAR CADA LIVRO */

    carrinho.forEach(
        (livro,index) => {


        const subtotal =
        livro.preco *
        livro.quantidade;


        total += subtotal;


        lista.innerHTML += `

            <div class="item">

                <img
                    src="${livro.imagem}"
                    alt="${livro.nome}">


                <div class="info">

                    <h2>
                        ${livro.nome}
                    </h2>

                    <div class="autor">
                        ${livro.autor}
                    </div>

                    <div class="preco">

                        R$ ${livro.preco
                        .toFixed(2)
                        .replace(".",",")}

                    </div>


                    <div class="quantidade">

                        <button
                            onclick="diminuir(${index})">

                            −

                        </button>


                        <span class="numero">

                            ${livro.quantidade}

                        </span>


                        <button
                            onclick="aumentar(${index})">

                            +

                        </button>

                    </div>

                </div>


                <div>

                    <p style="margin-bottom:10px;">

                        Subtotal:
                        <strong>

                            R$ ${subtotal
                            .toFixed(2)
                            .replace(".",",")}

                        </strong>

                    </p>


                    <button
                        class="remover"
                        onclick="remover(${index})">

                        Remover

                    </button>

                </div>

            </div>

        `;

    });


    document.getElementById(
        "total"
    ).textContent =

        "R$ " +

        total
        .toFixed(2)
        .replace(".",",");

}


/* =========================
   AUMENTAR
========================= */

function aumentar(index){

    let carrinho =
    pegarCarrinho();


    carrinho[index].quantidade++;


    salvarCarrinho(carrinho);


    mostrarCarrinho();

}


/* =========================
   DIMINUIR
========================= */

function diminuir(index){

    let carrinho =
    pegarCarrinho();


    if(
        carrinho[index].quantidade > 1
    ){

        carrinho[index].quantidade--;

    }else{

        carrinho.splice(index,1);

    }


    salvarCarrinho(carrinho);


    mostrarCarrinho();

}


/* =========================
   REMOVER
========================= */

function remover(index){

    let carrinho =
    pegarCarrinho();


    carrinho.splice(index,1);


    salvarCarrinho(carrinho);


    mostrarCarrinho();

}


/* =========================
   FINALIZAR
========================= */

function finalizarCompra(){

    alert(
        "Compra finalizada! Obrigado por visitar a Biblioteca Livski."
    );

}


/* =========================
   INICIAR
========================= */

mostrarCarrinho();

</script>


</body>

</html>
