<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrinho - Biblioteca Livski</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f1ea;
    color:#222;
}

/* CABEÇALHO */

header{
    background:#1b1b1b;
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    font-family:'Cinzel',serif;
    font-size:2.5rem;
}

/* CONTAINER */

.container{
    width:90%;
    max-width:1000px;
    margin:50px auto;
}

/* VOLTAR */

.voltar{
    display:inline-block;
    margin-bottom:25px;
    color:#8b683d;
    text-decoration:none;
    font-weight:500;
}

.voltar:hover{
    text-decoration:underline;
}

/* CARRINHO */

.carrinho{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.produto{
    display:flex;
    align-items:center;
    gap:20px;
    padding:20px 0;
    border-bottom:1px solid #eee;
}

.produto img{
    width:100px;
    height:140px;
    object-fit:cover;
    border-radius:10px;
}

.produto-info{
    flex:1;
}

.produto-info h3{
    font-family:'Cinzel',serif;
    color:#3a2d1f;
}

.autor{
    color:#777;
    margin-top:5px;
}

.preco{
    color:#2d7a32;
    font-weight:bold;
    margin-top:8px;
}

/* QUANTIDADE */

.quantidade{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantidade button{
    width:32px;
    height:32px;
    border:none;
    border-radius:50%;
    background:#c59b5f;
    color:white;
    cursor:pointer;
    font-size:18px;
}

.quantidade button:hover{
    background:#a67c43;
}

.numero{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

/* REMOVER */

.remover{
    border:none;
    background:#b83232;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.remover:hover{
    background:#8f2525;
}

/* RESUMO */

.resumo{
    margin-top:30px;
    text-align:right;
}

.resumo h2{
    font-family:'Cinzel',serif;
    color:#3a2d1f;
}

.total{
    font-size:1.8rem;
    color:#2d7a32;
    font-weight:bold;
    margin:10px 0 20px;
}

/* BOTÕES */

.btn{
    border:none;
    padding:14px 25px;
    border-radius:30px;
    background:#c59b5f;
    color:white;
    cursor:pointer;
    font-size:1rem;
    text-decoration:none;
    display:inline-block;
    transition:.3s;
}

.btn:hover{
    background:#a67c43;
    transform:scale(1.03);
}

/* CARRINHO VAZIO */

.vazio{
    text-align:center;
    padding:60px 20px;
}

.vazio h2{
    font-family:'Cinzel',serif;
    margin-bottom:15px;
}

.vazio p{
    color:#777;
    margin-bottom:25px;
}

/* RESPONSIVO */

@media(max-width:700px){

    .produto{
        flex-wrap:wrap;
    }

    .produto img{
        width:80px;
        height:110px;
    }

    .produto-info{
        min-width:calc(100% - 120px);
    }

    .quantidade{
        margin-left:100px;
    }

    .remover{
        margin-left:auto;
    }

}

</style>

</head>

<body>


<header>

    <h1>
        🛒 Seu Carrinho
    </h1>

</header>


<div class="container">

    <a
        href="index.html"
        class="voltar">

        ← Voltar para a Biblioteca

    </a>


    <div
        class="carrinho"
        id="carrinho">

    </div>

</div>


<script>

/* PEGAR CARRINHO */

let carrinho =
    JSON.parse(
        localStorage.getItem("carrinhoLivski")
    ) || [];


/* ELEMENTO */

const elementoCarrinho =
    document.getElementById("carrinho");


/* FORMATAR DINHEIRO */

function dinheiro(valor){

    return valor.toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* SALVAR */

function salvar(){

    localStorage.setItem(
        "carrinhoLivski",
        JSON.stringify(carrinho)
    );

}


/* RENDERIZAR */

function renderizar(){

    if(carrinho.length === 0){

        elementoCarrinho.innerHTML = `

            <div class="vazio">

                <h2>
                    Seu carrinho está vazio
                </h2>

                <p>
                    Parece que você ainda não escolheu nenhum livro.
                </p>

                <a
                    href="index.html#catalogo"
                    class="btn">

                    Explorar livros

                </a>

            </div>

        `;

        return;

    }


    let html = "";

    let total = 0;


    carrinho.forEach((produto,index) => {

        const subtotal =
            produto.preco *
            produto.quantidade;

        total += subtotal;


        html += `

            <div class="produto">

                <img
                    src="${imagemLivro(produto.nome)}"
                    alt="${produto.nome}">

                <div class="produto-info">

                    <h3>
                        ${produto.nome}
                    </h3>

                    <p class="autor">
                        ${produto.autor}
                    </p>

                    <p class="preco">
                        ${dinheiro(produto.preco)}
                    </p>

                </div>


                <div class="quantidade">

                    <button
                        onclick="diminuir(${index})">

                        −

                    </button>

                    <span class="numero">
                        ${produto.quantidade}
                    </span>

                    <button
                        onclick="aumentar(${index})">

                        +

                    </button>

                </div>


                <button
                    class="remover"
                    onclick="remover(${index})">

                    Remover

                </button>

            </div>

        `;

    });


    html += `

        <div class="resumo">

            <h2>
                Resumo do pedido
            </h2>

            <div class="total">
                Total: ${dinheiro(total)}
            </div>

            <button
                class="btn"
                onclick="finalizar()">

                Finalizar pedido

            </button>

        </div>

    `;


    elementoCarrinho.innerHTML = html;

}


/* IMAGENS */

function imagemLivro(nome){

    const imagens = {

        "Crime e Castigo":
            "imagens/crime e castigo.jpg",

        "A Hora da Estrela":
            "imagens/a hora da estrela.jpg",

        "Dom Casmurro":
            "imagens/dom casmurro.jpg",

        "Oração para Desaparecer":
            "imagens/oração para desaparecer.jpg",

        "Guerra e Paz":
            "imagens/guerra e paz.jpg",

        "Capitães da Areia":
            "imagens/capitães da areia.png"

    };

    return imagens[nome] || "";

}


/* AUMENTAR */

function aumentar(index){

    carrinho[index].quantidade++;

    salvar();

    renderizar();

}


/* DIMINUIR */

function diminuir(index){

    if(carrinho[index].quantidade > 1){

        carrinho[index].quantidade--;

    }else{

        carrinho.splice(index,1);

    }

    salvar();

    renderizar();

}


/* REMOVER */

function remover(index){

    carrinho.splice(index,1);

    salvar();

    renderizar();

}


/* FINALIZAR */

function finalizar(){

    alert(
        "Pedido finalizado com sucesso! Obrigado por visitar a Biblioteca Livski."
    );

}


/* INICIAR */

renderizar();

</script>

</body>

</html>
